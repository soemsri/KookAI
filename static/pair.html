<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open KookAI</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1115;
      color: #f3f4f6;
    }

    main {
      width: min(360px, calc(100vw - 40px));
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    p {
      margin: 0 0 24px;
      color: #9ca3af;
      line-height: 1.45;
    }

    a {
      display: block;
      padding: 15px 18px;
      border-radius: 12px;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Open KookAI</h1>
    <p>Continue pairing this iPhone with your desktop workspace.</p>
    <a id="openApp" href="#">Open KookAI</a>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const pin = params.get("pin") || "";
    const link = /^\d{6}$/.test(pin) ? `kookai://pair?pin=${pin}` : "kookai://";
    const button = document.getElementById("openApp");

    button.href = link;
    window.location.href = link;
  </script>
</body>
</html>
